<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" href="static/css/style-user.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="user-container">
        <!-- BOTÃO TOGGLE (HAMBÚRGUER) -->
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir/fechar menu">☰</button>

        <!-- SIDEBAR -->
        <aside class="sidebar-user" id="sidebar-user">
            <div class="user-header">
                <div class="logo-sidebar">
                    <img src="static/src/avatares/logo.png" alt="Booksly">
                </div>
                <div class="avatar" id="avatar-container">
                    <img id="user-avatar" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iNTAiIGZpbGw9IiNlZWUiLz48Y2lyY2xlIGN4PSI1MCIgY3k9IjQwIiByPSIxNSIgZmlsbD0iI2NjYyIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iODUiIHI9IjMwIiBmaWxsPSIjY2NjIi8+PC9zdmc+" alt="Avatar">
                </div>
                <span class="user-name" id="user-nome">Carregando...</span>
                <span class="user-apelido" id="user-apelido"></span>
            </div>

            <nav class="menu-user">
                <ul>
                    <li><a href="#" data-section="inicio" class="active">Página Inicial</a></li>
                    <li><a href="#" data-section="perfil">Perfil</a></li>
                    <li><a href="#" data-section="meus-livros">Meus Livros</a></li>
                    <li><a href="#" data-section="solicitar-livros">Solicitar Livros</a></li>
                    <!-- Editar Perfil removido da sidebar -->
                    <li><a href="#" data-section="notificacoes">Notificações <span id="badge-notificacoes">0</span></a></li>
                    <li><a href="#" id="logout-user">Sair</a></li>
                </ul>
                <div class="sidebar-footer">
                    <a href="https://github.com/ronaldokaras/sistema-biblioteca-grupo" target="_blank" rel="noopener" class="github-link">
                        GitHub
                    </a>
                </div>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-user" id="main-user">
            <header class="topbar-user">
                <h1 id="section-title-user">Página Inicial</h1>
                <div class="topbar-actions-user"></div>
            </header>

            <div class="main-content-wrapper">
                <!-- COLUNA ESQUERDA (conteúdo principal) -->
                <div class="content-left" id="content-left">
                    <p>Carregando...</p>
                </div>

                <!-- COLUNA DIREITA (comunidade + notificações) -->
                <div class="content-right" id="content-right">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3 style="margin:0;">Comunidade</h3>
                        <button id="btn-notificacoes-topo" style="background:transparent; border:none; color:var(--accent-color); font-size:1.3rem; cursor:pointer; position:relative;" title="Ver notificações">
                            🔔
                            <span id="badge-notificacoes-topo" style="display:none; position:absolute; top:-8px; right:-10px; background:#e74c3c; color:#fff; border-radius:50%; padding:2px 6px; font-size:0.65rem; font-weight:bold;"></span>
                        </button>
                    </div>
                    <div id="comunidade-container">
                        <p style="color:var(--text-secondary);">Carregando avaliações...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-dev">
                <span>Desenvolvido por</span>
                <span class="dev-name">Gustavo Duanny Pelepe</span>
                <span class="separator">•</span>
                <span class="dev-name">Ronaldo Henrique Karas</span>
                <span class="separator">•</span>
                <span class="dev-name">Douglas Becker</span>
            </div>
            <div class="footer-github">
                <a href="https://github.com/ronaldokaras/sistema-biblioteca-grupo" target="_blank" rel="noopener">
                    <span class="github-icon"></span> GitHub
                </a>
                <span class="footer-year">© 2026</span>
            </div>
        </div>
    </footer>

    <!-- NOTIFICAÇÃO -->
    <div id="notificacao-user" class="notificacao-user" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.3/dist/dexie.js"></script>
    <script src="static/js/utils.js"></script>
    <script src="static/js/db.js"></script>
    <script src="static/js/user-app.js"></script>
</body>
</html>
